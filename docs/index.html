<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<title>Ronda Fonoaudiología</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Aparece cuando se instaló una versión nueva de la app. Va en el flujo, arriba
     de todo, y no fijo: así no tapa los botones de la cabecera. -->
<div class="aviso-version oculto" id="avisoVersion">
  <button id="avisoVersionCargar">Hay una versión nueva de la app · Toca para cargarla</button>
  <button id="avisoVersionCerrar" aria-label="Ahora no">×</button>
</div>

<!-- Configuración inicial -->
<div id="configuracion" class="oculto"></div>

<!-- App -->
<div id="app" class="oculto">

  <div id="ronda">
    <div class="barra">
      <div class="barra-fila">
        <div class="barra-titulo">
          <div class="eyebrow">Fonoaudiología</div>
          <h1>Ronda</h1>
        </div>
        <button class="pill sync-off" id="pillSync"></button>
        <button class="icon-btn" id="btnRefrescar" aria-label="Actualizar censo"></button>
        <button class="icon-btn" id="btnAjustes" aria-label="Configuración"></button>
      </div>

      <div class="subfila">
        <span id="fechaHoy"></span>
        <span class="frescura" id="estadoLista"></span>
      </div>

      <div class="buscador">
        <button class="buscador-cerrado" id="buscadorCerrado">
          <span id="icoBuscar"></span>
          <span>Buscar cama, nombre o RUT</span>
        </button>
        <div class="buscador-abierto oculto" id="buscadorAbierto">
          <input type="search" id="inputBuscar" placeholder="Cama, nombre o RUT" autocomplete="off">
          <button id="btnCerrarBuscar">Cerrar</button>
        </div>
      </div>

      <div class="progreso">
        <div class="progreso-fila">
          <span id="progresoTexto">—</span>
          <span id="progresoPct" style="font-weight:600;color:var(--primary)">—</span>
        </div>
        <div class="progreso-barra"><div class="progreso-relleno" id="progresoRelleno" style="width:0%"></div></div>
      </div>
    </div>

    <main>
      <div id="lista"></div>
      <button class="plegable oculto" id="bloqueEgresos">
        <span id="icoArchivo"></span>
        <span id="egresosTexto">Egresos recientes</span>
        <span class="flecha" id="icoFlecha"></span>
      </button>
      <div id="listaEgresos" class="oculto" style="margin-top:8px"></div>
    </main>

    <button class="fab" id="fab"><span id="icoMas"></span> Ingreso</button>
  </div>

  <!-- Vista 2 -->
  <div id="dashboard" class="oculto"></div>

  <!-- Vista 3 -->
  <div id="informes" class="oculto"></div>

  <!-- Pantallas a pantalla completa: sesión, ingreso -->
  <div id="pantalla" class="oculto"></div>

  <nav class="nav">
    <button data-vista="ronda" class="activo"><span id="navRonda"></span>Ronda</button>
    <button data-vista="dashboard"><span id="navDash"></span>Dashboard</button>
    <button data-vista="informes"><span id="navInf"></span>Informes</button>
  </nav>
</div>

<div class="toast" id="toast"></div>


<!-- Aquí se arma el informe justo antes de imprimir. Invisible en pantalla. -->
<div id="impresion"></div>

<script src="app.js"></script>
<script src="pantallas.js"></script>
<script src="dashboard.js"></script>
<script src="informes.js"></script>
<script>
  // Los iconos del armazón se insertan una vez, desde el mismo catálogo que usan
  // las pantallas, para no repetir el SVG dentro del HTML.
  document.getElementById('icoBuscar').innerHTML   = ICO.buscar;
  document.getElementById('icoArchivo').innerHTML  = ICO.archivo;
  document.getElementById('icoFlecha').innerHTML   = ICO.flecha;
  document.getElementById('icoMas').innerHTML      = ICO.mas;
  document.getElementById('btnRefrescar').innerHTML = ICO.volver;
  document.getElementById('btnAjustes').innerHTML   = ICO.ajustes;
  document.getElementById('navRonda').innerHTML    = ICO.lista;
  document.getElementById('navDash').innerHTML     = ICO.grafico;
  document.getElementById('navInf').innerHTML      = ICO.doc;

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));

    // Antes una versión nueva llegaba recién al segundo arranque y no había
    // forma de saberlo. Ahora, cuando el service worker nuevo toma el control,
    // se ofrece recargar. Solo si ya había uno: la primera instalación no avisa.
    const habiaVersion = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!habiaVersion) return;
      document.getElementById('avisoVersion').classList.remove('oculto');
    });
    document.getElementById('avisoVersionCargar').onclick = () => location.reload();
    document.getElementById('avisoVersionCerrar').onclick = () =>
      document.getElementById('avisoVersion').classList.add('oculto');
  }

  // El service worker anterior (v9) refrescaba cada archivo por su cuenta: con
  // mala señal podía dejar mezclados archivos de dos versiones, y esa mezcla no
  // funciona. Si falta algo de esta versión, se dice qué hacer en vez de fallar
  // en silencio al tocar un botón.
  const completa = typeof actualizar === 'function' && typeof abrirBandeja === 'function' &&
                   typeof Meses === 'object' && typeof actualizarInformes === 'function';
  if (!completa) {
    // Sin arranque: el de app.js (nuevo o viejo) fallaría con esta pantalla
    // puesta y la taparía con "No se pudo iniciar".
    window.iniciar = () => Promise.resolve();
    window.addEventListener('DOMContentLoaded', () => {
      document.body.innerHTML = `<div class="centrado">
          <h1>Falta terminar de actualizar</h1>
          <p>La versión nueva de la app se descargó a medias por falta de señal.
             Conéctate a wifi o a una red con buena señal y toca el botón.</p>
          <button class="btn btn-primario" id="completarVersion">Completar la actualización</button>
        </div>`;
      document.getElementById('completarVersion').onclick = () => {
        const recargar = () => location.reload();
        if (!('serviceWorker' in navigator)) return recargar();
        navigator.serviceWorker.addEventListener('controllerchange', recargar);
        navigator.serviceWorker.getRegistration()
          .then(r => r && r.update())
          .catch(() => {})
          .finally(() => setTimeout(recargar, 8000));
      };
    });
  }
</script>
</body>
</html>
